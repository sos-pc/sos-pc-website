[build]
  command = "npm run build"
  publish = "dist"

  [build.environment]
    NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[redirects]]
from = "https://talos-int.com/*"
to = "https://www.talos-int.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://sos-pc.click/*"
to = "https://www.talos-int.com/:splat"
status = 301
force = true

[[redirects]]
from = "/diag.ps1"
to = "https://sos-pc-diagnostic.netlify.app/diag.ps1"
status = 200
force = true
